spring:
  application:
    name: ProjectAI

  datasource:
    url: ${DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  ai:
    google:
      genai:
        api-key: ${API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
        embedding:
          api-key: ${API_KEY}
          text:
            dimensions: 768
    vectorstore:
      pgvector:
        dimensions: 768
        initialize-schema: true


